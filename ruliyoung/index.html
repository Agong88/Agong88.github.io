<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gomoku - 經典五子棋</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="A premium and beautiful Gomoku game built with HTML, CSS, and JS.">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>五子棋</h1>
            <p class="subtitle">經典對戰，智力交鋒</p>
        </header>

        <main class="game-area">
            <div class="game-info">
                <div class="player black-player active" id="player-black">
                    <div class="avatar"></div>
                    <span class="name">黑棋</span>
                </div>
                <div class="status-indicator">
                    <span id="turn-text">等待開始...</span>
                </div>
                <div class="player white-player" id="player-white">
                    <div class="avatar"></div>
                    <span class="name">白棋</span>
                </div>
            </div>

            <div class="board-container">
                <div id="board" class="board">
                    <!-- Board cells will be generated by JS -->
                </div>
            </div>

            <div class="controls">
                <button id="reset-btn" class="btn primary-btn">重新局賽</button>
            </div>
        </main>

        <!-- Win Modal -->
        <div id="win-modal" class="modal hidden">
            <div class="modal-content">
                <h2 id="win-message">黑棋獲勝！</h2>
                <button id="modal-reset-btn" class="btn primary-btn">再玩一次</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
